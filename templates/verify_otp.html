<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify OTP - JobPilot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="auth-page">

    <div class="auth-card">

        <div class="brand">

            <h1>JobPilot</h1>

            <p>
                Verify your email address
            </p>

        </div>


        {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('verify_otp') }}"
        >

            <div class="form-group">

                <label
                    for="otp"
                    class="form-label"
                >
                    Enter OTP
                </label>

                <input
                    type="text"
                    id="otp"
                    name="otp"
                    class="form-control otp-input"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    required
                >

                <div class="form-text">
                    The OTP is valid for 5 minutes.
                </div>

            </div>


            <button
                type="submit"
                class="btn-login"
            >
                Verify OTP
            </button>

        </form>


        <div class="login-link">

            <a href="{{ url_for('forgot_password') }}">
                Request a new OTP
            </a>

        </div>


        <div class="login-link">

            <a href="{{ url_for('login') }}">
                Back to Login
            </a>

        </div>

    </div>

</body>

</html>
