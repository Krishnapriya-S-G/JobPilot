<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | JobPilot</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Poppins -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- JobPilot CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="auth-page">

<div class="auth-card">

    <div class="brand">

        <h1>
            <span style="color:#0d6efd;">Job</span>Pilot
        </h1>

        <p>
            From Application to Opportunity.
        </p>

    </div>


    {% if error %}

    <div class="alert alert-danger">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required
            >
            
        </div>

        <div class="forgot-password-link">

            <a href="{{ url_for('forgot_password') }}">
                Forgot Password?
            </a>

        </div>


        <button
            type="submit"
            class="btn-login"
        >
            Login
        </button>

    </form>


    <div class="register-link">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create account
        </a>

    </div>

</div>

</body>

</html>
