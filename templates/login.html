<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | JobPilot</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Poppins -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- JobPilot CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="auth-page">

<div class="auth-card">

    <div class="brand">

    <div class="auth-brand-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6a2 2 0 0 1 2 2v2H7V5a2 2 0 0 1 2-2Z"></path>
            <rect x="3" y="7" width="18" height="14" rx="2"></rect>
            <path d="M3 12h18"></path>
        </svg>
    </div>

    <h1>
        <span class="brand-accent">Job</span>Pilot
    </h1>

    <p>
        From Application to Opportunity.
    </p>

</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    {% if error %}

    <div class="alert alert-danger">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required
            >
            
        </div>

        <div class="forgot-password-link">

            <a href="{{ url_for('forgot_password') }}">
                Forgot Password?
            </a>

        </div>


        <button
            type="submit"
            class="btn-login"
        >
            Login
        </button>

    </form>


    <div class="register-link">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create account
        </a>

    </div>

</div>

</body>

</html>
