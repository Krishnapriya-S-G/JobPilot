<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - JobPilot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="auth-page">

    <div class="auth-card">

        <div class="brand">

            <div class="auth-brand-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
                     stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 3h6a2 2 0 0 1 2 2v2H7V5a2 2 0 0 1 2-2Z"></path>
                    <rect x="3" y="7" width="18" height="14" rx="2"></rect>
                    <path d="M3 12h18"></path>
                </svg>
            </div>

            <h1>
                <span class="brand-accent">Job</span>Pilot
            </h1>

            <p>
                Reset your password securely
            </p>

        </div>


        {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('forgot_password') }}"
        >

            <div class="form-group">

                <label
                    for="email"
                    class="form-label"
                >
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-login"
            >
                Continue
            </button>

        </form>


        <div class="login-link">

            Remember your password?

            <a href="{{ url_for('login') }}">
                Back to Login
            </a>

        </div>

    </div>

</body>

</html>
