<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - JobPilot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="auth-page">

    <div class="auth-card">

        <div class="brand">

            <h1>JobPilot</h1>

            <p>
                Reset your password securely
            </p>

        </div>


        {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('forgot_password') }}"
        >

            <div class="form-group">

                <label
                    for="email"
                    class="form-label"
                >
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-login"
            >
                Continue
            </button>

        </form>


        <div class="login-link">

            Remember your password?

            <a href="{{ url_for('login') }}">
                Back to Login
            </a>

        </div>

    </div>

</body>

</html>
