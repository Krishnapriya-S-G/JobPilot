<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JobPilot</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <!-- JobPilot CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container-fluid px-4">

        <!-- LOGO -->

        <a
            class="navbar-brand"
            href="{{ url_for('dashboard') }}"
        >
            JobPilot
        </a>


        <!-- NAVIGATION -->

        <div class="navbar-nav ms-auto d-flex flex-row align-items-center">

            <!-- Dashboard -->

            <a
                class="nav-link"
                href="{{ url_for('dashboard') }}"
            >
                Dashboard
            </a>


            <!-- Applications -->

            <a
                class="nav-link"
                href="{{ url_for('jobs_page') }}"
            >
                Applications
            </a>


            <!-- Interviews -->

            <a
                class="nav-link"
                href="{{ url_for('interviews_page') }}"
            >
                Interviews
            </a>


           <!-- Resume Match -->
  
            <a
                class="nav-link"
                href="{{ url_for('resume_match') }}"
            >
                Resume Match
            </a>

            <!-- Logout -->
 
            <a
                class="nav-link"
                href="{{ url_for('logout') }}"
            >
                Logout
            </a>


        </div>

    </div>

</nav>


<!-- =========================
     MAIN CONTENT
========================= -->

<main class="container-fluid main-container">

    {% block content %}

    {% endblock %}

</main>


<!-- =========================
     CUSTOM JAVASCRIPT
========================= -->

<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>


</body>

</html>
