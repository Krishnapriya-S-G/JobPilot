<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | JobPilot</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Poppins -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- JobPilot CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="auth-page">

<div class="auth-card">

    <!-- BRAND -->
    <div class="brand">

    <div class="auth-brand-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6a2 2 0 0 1 2 2v2H7V5a2 2 0 0 1 2-2Z"></path>
            <rect x="3" y="7" width="18" height="14" rx="2"></rect>
            <path d="M3 12h18"></path>
        </svg>
    </div>

    <h1>
        <span class="brand-accent">Job</span>Pilot
    </h1>

    <p>
        Create your account and manage your job search.
    </p>

</div>


    <!-- ERROR -->
    {% if error %}

    <div class="alert alert-danger">
        {{ error }}
    </div>

    {% endif %}


    <!-- REGISTER FORM -->
    <form method="POST">

        <!-- USERNAME -->
        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

            <div id="usernameFeedback" class="form-text"></div>

        </div>


        <!-- EMAIL -->

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <div id="emailFeedback" class="form-text"></div>

        </div>


        <!-- PASSWORD -->
        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Create a password"
                minlength="6"
                autocomplete="new-password"
                required
            >

        </div>


        <!-- CONFIRM PASSWORD -->
        <div class="mb-4">

            <label class="form-label">
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                class="form-control"
                placeholder="Confirm your password"
                minlength="6"
                autocomplete="new-password"
                required
            >

        </div>


        <!-- REGISTER BUTTON -->
        <button
            type="submit"
            class="btn-register"
        >
            Create Account
        </button>

    </form>


    <!-- LOGIN LINK -->
    <div class="login-link">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </div>

</div>


<script>

function debounce(fn, delay) {
    let timer;
    return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
    };
}

function setFeedback(el, message, ok) {
    el.textContent = message;
    el.style.color = ok ? "#0f7a3d" : "#dc3545";
}

const usernameInput = document.getElementById("username");
const usernameFeedback = document.getElementById("usernameFeedback");

const checkUsername = debounce(async function () {

    const value = usernameInput.value.trim();

    if (!value) {
        usernameFeedback.textContent = "";
        return;
    }

    try {
        const res = await fetch(`/api/check-username?username=${encodeURIComponent(value)}`);
        const data = await res.json();
        setFeedback(usernameFeedback, data.message, data.available);
    } catch (err) {
        usernameFeedback.textContent = "";
    }

}, 400);

if (usernameInput) {
    usernameInput.addEventListener("input", checkUsername);
}


const emailInput = document.getElementById("email");
const emailFeedback = document.getElementById("emailFeedback");

const checkEmail = debounce(async function () {

    const value = emailInput.value.trim();

    if (!value) {
        emailFeedback.textContent = "";
        return;
    }

    try {
        const res = await fetch(`/api/check-email?email=${encodeURIComponent(value)}`);
        const data = await res.json();
        setFeedback(emailFeedback, data.message, data.available);
    } catch (err) {
        emailFeedback.textContent = "";
    }

}, 400);

if (emailInput) {
    emailInput.addEventListener("input", checkEmail);
}

</script>
</body>

</html>
