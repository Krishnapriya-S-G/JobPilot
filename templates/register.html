<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | JobPilot</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Poppins -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- JobPilot CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="auth-page">

<div class="auth-card">

    <!-- BRAND -->
    <div class="brand">

        <h1>
            <span style="color:#0d6efd;">Job</span>Pilot
        </h1>

        <p>
            Create your account and manage your job search.
        </p>

    </div>


    <!-- ERROR -->
    {% if error %}

    <div class="alert alert-danger">
        {{ error }}
    </div>

    {% endif %}


    <!-- REGISTER FORM -->
    <form method="POST">

        <!-- USERNAME -->
        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

        </div>


        <!-- EMAIL -->
        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <!-- PASSWORD -->
        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Create a password"
                minlength="6"
                autocomplete="new-password"
                required
            >

        </div>


        <!-- CONFIRM PASSWORD -->
        <div class="mb-4">

            <label class="form-label">
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                class="form-control"
                placeholder="Confirm your password"
                minlength="6"
                autocomplete="new-password"
                required
            >

        </div>


        <!-- REGISTER BUTTON -->
        <button
            type="submit"
            class="btn-register"
        >
            Create Account
        </button>

    </form>


    <!-- LOGIN LINK -->
    <div class="login-link">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </div>

</div>

</body>

</html>
