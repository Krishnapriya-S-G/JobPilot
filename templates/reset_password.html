<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - JobPilot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="auth-page">

    <div class="auth-card">

        <div class="brand">

    <div class="auth-brand-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6a2 2 0 0 1 2 2v2H7V5a2 2 0 0 1 2-2Z"></path>
            <rect x="3" y="7" width="18" height="14" rx="2"></rect>
            <path d="M3 12h18"></path>
        </svg>
    </div>

    <h1>
        <span class="brand-accent">Job</span>Pilot
    </h1>

    <p>
        Create your new password
    </p>

</div>


        {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST" action="{{ url_for('reset_password') }}">

            <div class="mb-3">

                <label
                    for="password"
                    class="form-label"
                >
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter new password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="mb-4">

                <label
                    for="confirm_password"
                    class="form-label"
                >
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm new password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-login"
            >
                Reset Password
            </button>

        </form>


        <div class="login-link">

            <a href="{{ url_for('login') }}">
                Back to Login
            </a>

        </div>

    </div>

</body>

</html>
