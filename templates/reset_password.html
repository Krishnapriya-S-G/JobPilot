<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - JobPilot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="auth-page">

    <div class="auth-card">

        <div class="brand">

            <h1>JobPilot</h1>

            <p>
                Create your new password
            </p>

        </div>


        {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST" action="{{ url_for('reset_password', user_id=user_id) }}"></form>

            <div class="form-group">

                <label
                    for="password"
                    class="form-label"
                >
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="form-group">

                <label
                    for="confirm_password"
                    class="form-label"
                >
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-login"
            >
                Reset Password
            </button>

        </form>


        <div class="login-link">

            <a href="{{ url_for('login') }}">
                Back to Login
            </a>

        </div>

    </div>

</body>

</html>
